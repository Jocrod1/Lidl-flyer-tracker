name: Lidl Flyer Watch

on:
  schedule:
    # Lidl's publication timing is unknown; these four checks are a practical
    # strategy based on observed behavior, not a guaranteed publication window.
    # Repeated runs are intentional and safe because notifications are
    # deduplicated by flyer ID and normalized query in committed watch state.
    # All times are UTC (08:00/18:00 are ~09:00/19:00 in Spain in winter and
    # ~10:00/20:00 in summer). GitHub may delay scheduled runs under load.
    - cron: "0 8,18 * * 0,1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit back the updated notification state

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ./ingestion

      - name: Run product watch
        env:
          LIDL_SMTP_HOST: ${{ secrets.LIDL_SMTP_HOST }}
          LIDL_SMTP_PORT: ${{ secrets.LIDL_SMTP_PORT }}
          LIDL_SMTP_USER: ${{ secrets.LIDL_SMTP_USER }}
          LIDL_SMTP_PASSWORD: ${{ secrets.LIDL_SMTP_PASSWORD }}
          LIDL_SMTP_FROM: ${{ secrets.LIDL_SMTP_FROM }}
          LIDL_SMTP_USE_TLS: "1"
        run: |
          python -m lidl_tracker.cli_watch \
            --query "queso en salmuera" \
            --to "${{ secrets.LIDL_WATCH_TO }}"

      - name: Persist notification state
        run: |
          git config user.name "lidl-flyer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state/watch_state.json
          git diff --cached --quiet || git commit -m "chore: update watch state [skip ci]"
          git push
